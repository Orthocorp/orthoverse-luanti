# Orthoverse server settings (map settings come from the game's minetest.conf).
# Mounted into the luanti container; after editing: docker compose restart luanti
server_name = The Orthoverse
server_description = Every land is an Orthoverse token.
server_announce = false
port = 30000
# Players register on the web page, always with a password
disallow_empty_password = true
max_users = 50
enable_damage = true
# Players cannot hurt each other anywhere (monsters and falls still hurt)
enable_pvp = false
creative_mode = false

# Record every player's actions, so that an admin (rollback privilege) can see
# who changed a block (/rollback_check) and undo a player's changes
# (/rollback <player> <seconds>). Kept in rollback.sqlite in the world.
enable_rollback_recording = true

# Mapgen threads: plenty of cores on node 0
num_emerge_threads = 16

# Bounded, pre-generated world: send what players can see, not more
max_block_send_distance = 10
max_simultaneous_block_sends_per_client = 40
active_block_range = 3

# No bind_address here: the container sets its own, and since it publishes no
# port, only the web proxy on the private Compose network can reach the server.

# Animals (Animalia): the countryside animals spawn by themselves. Set to true
# to let the forest animals spawn too: wolves, foxes, reindeer, turkeys,
# opossums and grizzly bears (bears attack players).
orthoverse_forest_animals = false
