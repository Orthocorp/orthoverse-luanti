<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map · The Orthoverse</title>
<link rel="icon" type="image/png" href="/img/icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/site.css">
<script src="/js/site.js"></script>
<style>
  :root { --panel: rgba(30, 39, 80, 0.95); --ink: #efe6d0; --accent: #f5c64a; }
  html, body { margin: 0; height: 100%; background: #0c0a08; color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* The site header on top, the map filling the rest of the window */
  body { display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; background: #0c0a08 url("cave.png") 0 0 / 1536px 1152px;
    image-rendering: pixelated; }
  #map .leaflet-tile { image-rendering: auto; }
  .leaflet-cave-pane { pointer-events: none; }
  .panel { position: absolute; z-index: 1000; top: 12px; left: 12px; width: 300px;
    max-width: calc(100vw - 24px); box-sizing: border-box; background: var(--panel);
    border: 3px solid var(--outline); padding: 12px 14px; box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.35); }
  .panel h1 { margin: 0 0 4px; font: 16px/24px "Midnight", monospace; color: var(--gold); text-shadow: 2px 2px 0 var(--bronze); }
  .panel .sub { color: var(--quiet); font-size: 13px; margin: 0 0 10px; }
  .panel a { color: var(--accent); }
  .panel input { width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit;
    color: var(--ink); background: var(--night-3); border: 2px solid var(--line); border-radius: 0; }
  .panel input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 40vh; overflow-y: auto; }
  #results li { padding: 5px 6px; border-radius: 4px; cursor: pointer; }
  #results li:hover, #results li:focus { background: var(--night-3); outline: none; }
  #results .meta { color: var(--quiet); font-size: 12px; }
  #info { margin-top: 10px; font-size: 14px; }
  #info:empty { display: none; }
  #info .name { font-weight: 600; font-size: 16px; }
  #info .row { color: var(--quiet); }
  #info code { font-size: 11.5px; word-break: break-all; color: var(--ink); }
  #info .acts { margin-top: 8px; display: grid; gap: 4px; }
  #info .acts a { color: var(--accent); }
  .leaflet-tooltip { font: 13px system-ui, sans-serif; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--quiet); }
</style>
</head>
<body>
<div id="ov-header"></div>
<div id="stage">
<div id="map"></div>
<div class="panel">
  <h1>The map</h1>
  <p class="sub">Every land is an Orthoverse token. Click one, or find it:</p>
  <input id="search" type="search" placeholder="Find a land by name or token ID" autocomplete="off"
         aria-label="Find a land by name or token ID">
  <ul id="results"></ul>
  <div id="info" aria-live="polite"></div>
</div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
  // Map coordinates are Luanti node coordinates: lat = z (north), lng = x (east).
  // At zoom 6 one pixel is one node; the tile pyramid is 16384 nodes square,
  // centred on the origin (see web/map/make_tiles.py).
  const LAND = 96, HALF_LAND = 48, HALF = 8192, NATIVE = 6;
  const crs = L.extend({}, L.CRS.Simple, {
    transformation: new L.Transformation(1 / 64, HALF / 64, -1 / 64, HALF / 64),
  });
  const worldBounds = L.latLngBounds([-5664, -5664], [5664, 5664]);

  const map = L.map('map', {
    crs, minZoom: 0, maxZoom: 8, zoomSnap: 0.5, zoomControl: false,
    maxBounds: worldBounds.pad(0.25), preferCanvas: true, attributionControl: false,
  });
  // The tiles are added once lands.json says which drawing of the map is
  // current (tiles/<version>/...), and where the world was drawn
  const tiles = L.tileLayer('', {
    maxNativeZoom: NATIVE, maxZoom: 8, minZoom: 0, noWrap: true, tileSize: 256,
    bounds: L.latLngBounds([-HALF + 0.5, -HALF + 0.5], [HALF - 0.5, HALF - 0.5]),
  });
  L.control.zoom({ position: 'topright' }).addTo(map);
  // The site header arrives after the map has measured its space (and wraps
  // on narrow screens): keep the map the size of its stage
  new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('stage'));

  // Round the world, a torch-lit cave wall (cave.png, from the game's own
  // stone, ore and torch textures: tools/make_cave.py) instead of the map's
  // empty sea. One SVG shape with the world cut out of it, filled with the
  // cave as a pattern, so the rock moves with the map. The world ends at the
  // outer edge of the wall ring (lands +-58).
  const EDGE = 58 * LAND + HALF_LAND, FAR = 1e6, CAVE_W = 1536, CAVE_H = 1152;
  map.createPane('cave').style.zIndex = 250;   // above the tiles, below markers
  const caveRenderer = L.svg({ pane: 'cave', padding: 1 });
  L.polygon([
    [[-FAR, -FAR], [FAR, -FAR], [FAR, FAR], [-FAR, FAR]],
    [[-EDGE, -EDGE], [-EDGE, EDGE], [EDGE, EDGE], [EDGE, -EDGE]],
  ], { renderer: caveRenderer, interactive: false, fillColor: 'url(#ov-cave)', fillOpacity: 1,
       color: '#050302', weight: 4, opacity: 1 }).addTo(map);
  // The pattern goes into the renderer's SVG, which exists once the map has
  // a view (and the shape has been added)
  map.whenReady(() => {
    const NS = 'http://www.w3.org/2000/svg';
    const defs = document.createElementNS(NS, 'defs');
    const pattern = document.createElementNS(NS, 'pattern');
    pattern.setAttribute('id', 'ov-cave');
    pattern.setAttribute('patternUnits', 'userSpaceOnUse');
    pattern.setAttribute('width', CAVE_W);
    pattern.setAttribute('height', CAVE_H);
    const img = document.createElementNS(NS, 'image');
    img.setAttribute('href', 'cave.png');
    img.setAttribute('width', CAVE_W);
    img.setAttribute('height', CAVE_H);
    img.setAttribute('image-rendering', 'pixelated');
    img.setAttribute('preserveAspectRatio', 'none');
    pattern.appendChild(img);
    defs.appendChild(pattern);
    caveRenderer._container.prepend(defs);
  });
  map.fitBounds(worldBounds);

  // Land borders, drawn once zoomed in far enough to be useful
  const Grid = L.GridLayer.extend({
    createTile(coords) {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const g = c.getContext('2d');
      const scale = Math.pow(2, coords.z - NATIVE);   // pixels per node
      const x0 = coords.x * 256 / scale - HALF;       // node x at the tile's left
      const z0 = HALF - coords.y * 256 / scale;       // node z at the tile's top
      g.strokeStyle = 'rgba(255,255,255,0.28)';
      g.lineWidth = 1;
      const first = Math.ceil((x0 + HALF_LAND) / LAND) * LAND - HALF_LAND;
      for (let x = first; x < x0 + 256 / scale; x += LAND) {
        const px = Math.round((x - x0) * scale) + 0.5;
        g.beginPath(); g.moveTo(px, 0); g.lineTo(px, 256); g.stroke();
      }
      const firstZ = Math.floor((z0 + HALF_LAND) / LAND) * LAND - HALF_LAND;
      for (let z = firstZ; z > z0 - 256 / scale; z -= LAND) {
        const py = Math.round((z0 - z) * scale) + 0.5;
        g.beginPath(); g.moveTo(0, py); g.lineTo(256, py); g.stroke();
      }
      return c;
    },
  });
  const grid = new Grid({ minZoom: 4, maxZoom: 8, zIndex: 5 });
  grid.addTo(map);

  // Lands are keyed by the old Orthoverse coordinates: x east, z SOUTH.
  const byKey = new Map();
  let lands = [];
  const landKey = (lx, lz) => lx + ':' + lz;
  const landAt = (latlng) => {
    const lx = Math.floor((latlng.lng + HALF_LAND) / LAND);
    const lz = -Math.floor((latlng.lat + HALF_LAND) / LAND);
    return { lx, lz, land: byKey.get(landKey(lx, lz)) };
  };
  // Bounds of a land, in map coordinates
  const landBounds = (lx, lz) => {
    const x0 = lx * LAND - HALF_LAND, zTop = -lz * LAND - HALF_LAND + LAND;
    return L.latLngBounds([zTop - LAND, x0], [zTop, x0 + LAND]);
  };

  const info = document.getElementById('info');
  let highlight = null;

  // Levels 8-15 are 0-7 in the futuristic realm; a fantasy level 0 land is a
  // croft, open land in the game
  function realm(level) {
    if (level === 0) return 'Croft, open land';
    return level >= 8 ? 'Futuristic realm, level ' + (level - 8) : 'Level ' + level;
  }

  const CONTRACT = '0x118aed2606d02c2545c6d7d2d1021e567cc08922';
  let lastClick = null;   // the node clicked, for "visit this spot"

  function actions(lx, lz, land) {
    const acts = document.createElement('div');
    acts.className = 'acts';
    const link = (href, text, external) => {
      const a = document.createElement('a');
      a.href = href; a.textContent = text;
      if (external) { a.target = '_blank'; a.rel = 'noopener'; }
      acts.append(a);
    };
    const me = window.OV && OV.me;
    if (!land.h) {
      const mine = me && me.signedIn && me.lands && me.lands.some(l => l.key === landKey(lx, lz));
      link('/account/#' + landKey(lx, lz), mine ? 'Your land: upgrade or flip it' : 'Gift this land a castle upgrade');
      link('https://opensea.io/item/ethereum/' + CONTRACT + '/' + BigInt(land.t).toString(), 'This token on OpenSea', true);
    }
    if (me && me.canVisit && lastClick) {
      link('/play/?visit=' + lastClick.x + ',' + lastClick.z, 'Visit this spot in the game (' + lastClick.x + ', ' + lastClick.z + ')');
    }
    return acts;
  }

  function show(lx, lz, land) {
    if (highlight) highlight.remove();
    highlight = L.rectangle(landBounds(lx, lz), {
      color: '#e3b341', weight: 2, fill: false, interactive: false,
    }).addTo(map);
    info.textContent = '';
    const name = document.createElement('div');
    name.className = 'name';
    const row = document.createElement('div');
    row.className = 'row';
    if (land) {
      name.textContent = land.h ? land.h : land.n;
      row.textContent = (land.h ? 'Henge' : realm(land.l)) + ' · land ' + landKey(lx, lz);
      const tok = document.createElement('div');
      tok.className = 'row';
      const code = document.createElement('code');
      code.textContent = land.t;
      tok.append('Token ', code);
      info.append(name, row, tok, actions(lx, lz, land));
    } else {
      name.textContent = 'Open sea';
      row.textContent = 'Land ' + landKey(lx, lz) + ' is not revealed yet';
      info.append(name, row);
      if (window.OV && OV.me && OV.me.canVisit && lastClick) info.append(actions(lx, lz, { h: true }));
    }
    shown = [lx, lz, land];
    try { history.replaceState(null, '', '#' + landKey(lx, lz)); } catch (e) { /* fine */ }
  }

  let shown = null;
  // Signing in or out changes the links
  if (window.OV) OV.on(() => { if (shown) show(...shown); });
  else document.addEventListener('DOMContentLoaded', () => OV.on(() => { if (shown) show(...shown); }));

  function flyTo(lx, lz) {
    lastClick = null;
    map.flyToBounds(landBounds(lx, lz), { maxZoom: 5.5, duration: 0.8 });
    show(lx, lz, byKey.get(landKey(lx, lz)));
  }

  map.on('click', (e) => {
    const { lx, lz, land } = landAt(e.latlng);
    if (Math.max(Math.abs(lx), Math.abs(lz)) > 58) return;
    lastClick = { x: Math.floor(e.latlng.lng), z: Math.floor(e.latlng.lat) };
    show(lx, lz, land);
  });

  // Name under the pointer
  const tip = L.tooltip({ direction: 'top', offset: [0, -8], opacity: 0.95 });
  map.on('mousemove', (e) => {
    const { land } = landAt(e.latlng);
    if (land && map.getZoom() >= 3) {
      // As text: a land's name is chosen by its holder, so never read as HTML
      const label = document.createElement('span');
      label.textContent = land.h || land.n;
      tip.setLatLng(e.latlng).setContent(label);
      if (!map.hasLayer(tip)) tip.addTo(map);
    } else if (map.hasLayer(tip)) {
      tip.remove();
    }
  });
  map.on('mouseout', () => tip.remove());

  // Search
  const search = document.getElementById('search');
  const results = document.getElementById('results');
  function runSearch() {
    const q = search.value.trim().toLowerCase();
    results.textContent = '';
    if (q.length < 2) return;
    const hits = lands.filter(l => l.n.toLowerCase().includes(q) ||
        (l.h && l.h.toLowerCase().includes(q)) ||
        (q.startsWith('0x') && l.t.startsWith(q))).slice(0, 30);
    for (const l of hits) {
      const li = document.createElement('li');
      li.tabIndex = 0;
      li.append(l.h || l.n);
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = (l.h ? 'Henge' : realm(l.l)) + ' · land ' + landKey(l.x, l.z);
      li.append(meta);
      const go = () => { flyTo(l.x, l.z); results.textContent = ''; };
      li.addEventListener('click', go);
      li.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') go(); });
      results.append(li);
    }
    if (!hits.length) {
      const li = document.createElement('li');
      li.className = 'meta';
      li.textContent = 'No land found';
      results.append(li);
    }
  }
  search.addEventListener('input', runSearch);

  // A link like /map/#12:-3 opens on that land
  function followHash() {
    const m = location.hash.match(/^#(-?\d+):(-?\d+)$/);
    if (m) flyTo(parseInt(m[1], 10), parseInt(m[2], 10));
  }
  window.addEventListener('hashchange', followHash);

  fetch('lands.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
    // Tiles exist only where the world was drawn: don't ask for any others
    if (d.drawn) {
      // (half a node inside the edge: Leaflet counts touching as overlapping)
      tiles.options.bounds = L.latLngBounds([d.drawn.south + 0.5, d.drawn.west + 0.5],
                                            [d.drawn.north - 0.5, d.drawn.east - 0.5]);
    }
    tiles.setUrl(d.version ? `tiles/${d.version}/{z}/{x}/{y}.png` : 'tiles/{z}/{x}/{y}.png');
    tiles.addTo(map);
    lands = d.lands;
    for (const l of lands) byKey.set(landKey(l.x, l.z), l);
    followHash();
  });
</script>
</body>
</html>
