# Cloudflare's tunnel says https; a direct local request is plain http
map $http_x_forwarded_proto $forwarded_proto {
	default $http_x_forwarded_proto;
	""      $scheme;
}

# orthoverse.land inside the web container. The host's Cloudflare tunnel sends
# orthoverse.land here through the port compose publishes on 127.0.0.1.

server {
	listen 80 default_server;
	server_name _;
	server_tokens off;

	# Security headers (see the snippets); repeated in every location below
	# that sets headers of its own
	include /etc/nginx/snippets/ov-headers.conf;
	include /etc/nginx/snippets/ov-csp.conf;

	root /srv/site;
	index index.html;

	# Every page asks for the shared stylesheet and script by a name that
	# changes with their content (?v=, filled in when the image is built), so
	# no browser or Cloudflare copy of an older one is ever used with a newer
	# page. The browser game's page (/play/) gets it too.
	sub_filter_once off;
	sub_filter '"/css/site.css"' '"/css/site.css?v=__ASSETS__"';
	sub_filter '"/js/site.js"' '"/js/site.js?v=__ASSETS__"';

	gzip on;
	gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

	# Docker's resolver, so a restarted proxy container (new address) is found
	resolver 127.0.0.11 valid=10s ipv6=off;

	location / {
		include /etc/nginx/snippets/ov-headers.conf;
		include /etc/nginx/snippets/ov-csp.conf;
		try_files $uri $uri/ =404;
		# Always checked with the server (a quick "not modified" when unchanged),
		# so a changed page, header or script shows at once, not after the
		# browser's or Cloudflare's copy expires
		add_header Cache-Control "no-cache";
		# A page that does not exist: the cave under the world. Only here:
		# tiles, cards and the API keep plain 404s for the programs that ask
		error_page 404 /404.html;
	}

	location = /404.html {
		include /etc/nginx/snippets/ov-headers.conf;
		include /etc/nginx/snippets/ov-csp.conf;
		internal;
		add_header Cache-Control "no-cache";
	}

	# Map tiles, made by the map service. Each drawing of the map has its own
	# folder (tiles/<version>/), so they can be cached for good
	location /map/tiles/ {
		include /etc/nginx/snippets/ov-headers.conf;
		include /etc/nginx/snippets/ov-csp.conf;
		alias /srv/map/tiles/;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Each land from above (the token metadata's picture)
	location /map/lands/ {
		include /etc/nginx/snippets/ov-headers.conf;
		include /etc/nginx/snippets/ov-csp.conf;
		alias /srv/map/lands/;
		add_header Cache-Control "public, max-age=86400";
		add_header Access-Control-Allow-Origin "*";
	}

	# Which picture is each land's: changes with every redraw, so checked
	# every time (the home page shows some of the cards)
	location = /map/cards/index.json {
		include /etc/nginx/snippets/ov-headers.conf;
		include /etc/nginx/snippets/ov-csp.conf;
		alias /srv/map/cards/index.json;
		add_header Cache-Control "no-cache";
	}

	# Token pictures, named after their content: cached for good
	location /map/cards/ {
		include /etc/nginx/snippets/ov-headers.conf;
		include /etc/nginx/snippets/ov-csp.conf;
		alias /srv/map/cards/;
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header Access-Control-Allow-Origin "*";
	}

	# The land list, which also says which drawing of the map is current:
	# checked every time
	location = /map/lands.json {
		include /etc/nginx/snippets/ov-headers.conf;
		include /etc/nginx/snippets/ov-csp.conf;
		alias /srv/map/lands.json;
		add_header Cache-Control "no-cache";
	}

	# The browser game, installed by the client service. It runs with threads,
	# which browsers only allow on cross-origin isolated pages: hence COOP and
	# COEP on everything here.
	location /play/ {
		include /etc/nginx/snippets/ov-headers.conf;
		alias /srv/play/;
		index index.html;

		location ~ \.wasm$ {
			include /etc/nginx/snippets/ov-headers.conf;
			types { }
			default_type application/wasm;
			add_header Cross-Origin-Embedder-Policy "require-corp" always;
			add_header Cross-Origin-Opener-Policy "same-origin" always;
			add_header Cross-Origin-Resource-Policy "same-origin" always;
			add_header Cache-Control "public, max-age=31536000, immutable";
		}

		# Release files live in a directory named after the build, so they
		# never change and can be cached for good. The page itself must not be.
		location ~ ^/play/(index\.html)?$ {
			include /etc/nginx/snippets/ov-headers.conf;
			add_header Cross-Origin-Embedder-Policy "require-corp" always;
			add_header Cross-Origin-Opener-Policy "same-origin" always;
			add_header Cross-Origin-Resource-Policy "same-origin" always;
			add_header Cache-Control "no-cache, no-store, must-revalidate" always;
		}

		add_header Cross-Origin-Embedder-Policy "require-corp" always;
		add_header Cross-Origin-Opener-Policy "same-origin" always;
		add_header Cross-Origin-Resource-Policy "same-origin" always;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# The auth service's status (players, ownership reads, OpenSea): for the
	# operator only, on the server itself (./status.sh). Everything from the
	# internet comes through Cloudflare, which adds its Cf-Ray and
	# Cf-Connecting-IP headers to every request and lets nobody take them off:
	# with either, the page is not there.
	location = /auth/status {
		if ($http_cf_ray) { return 404; }
		if ($http_cf_connecting_ip) { return 404; }
		set $auth_upstream http://auth:8090;
		proxy_pass $auth_upstream;
		proxy_set_header Host $http_host;
	}

	# Wallet sign-in and player names (the auth service)
	location /auth/ {
		set $auth_upstream http://auth:8090;
		proxy_pass $auth_upstream;
		# The host as the browser sent it, port included: the sign-in message
		# names it, and wallets check it against the page they are on
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $forwarded_proto;
		client_max_body_size 16k;
	}

	# Token and collection metadata (the contract's uri() and contractURI())
	location /api/ {
		set $api_upstream http://auth:8090;
		proxy_pass $api_upstream;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $forwarded_proto;
	}

	# WebSocket to the web proxy, which relays to the game server
	location = /proxy {
		set $proxy_upstream http://proxy:8737;
		proxy_pass $proxy_upstream;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}
}
