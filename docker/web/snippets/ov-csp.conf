# What a page of the site may load. Wallets are browser extensions (outside
# the page's policy); the robot check is Cloudflare Turnstile; the fonts are
# Google's. Scripts may be inline (each page has one), so this is a second
# line of defence: it stops pages being framed, plugins, a changed <base>,
# forms posting elsewhere and data being sent to other sites.
# Not on the browser game (/play/), whose engine builds code at run time.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
