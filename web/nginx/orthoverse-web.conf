# Orthoverse website: landing page, map, browser client and its proxy.
# Listens on localhost only; the Cloudflare tunnel brings orthoverse.land here.
# @BASE@ and @PORT@ are filled in by tools/proliant/install-web.sh.

server {
	listen 127.0.0.1:@PORT@;
	server_name orthoverse.land www.orthoverse.land;

	root @BASE@/web/site;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

	access_log /var/log/nginx/orthoverse-web.access.log;
	error_log /var/log/nginx/orthoverse-web.error.log;

	location / {
		try_files $uri $uri/ =404;
		add_header Cache-Control "public, max-age=300";
	}

	# Generated map tiles change only when the map is regenerated
	location /map/tiles/ {
		add_header Cache-Control "public, max-age=86400";
	}

	location = /map/lands.json {
		add_header Cache-Control "public, max-age=600";
	}

	# The browser client. It runs with threads, which browsers only allow on
	# cross-origin isolated pages: hence COOP and COEP on everything here.
	location /play/ {
		alias @BASE@/web/play/;
		index index.html;

		location ~ \.wasm$ {
			types { }
			default_type application/wasm;
			add_header Cross-Origin-Embedder-Policy "require-corp" always;
			add_header Cross-Origin-Opener-Policy "same-origin" always;
			add_header Cross-Origin-Resource-Policy "same-origin" always;
			add_header Cache-Control "public, max-age=31536000, immutable";
		}

		# Release files live in a directory named after the build, so they
		# never change and can be cached for good. The page itself must not be.
		location ~ ^/play/(index\.html)?$ {
			add_header Cross-Origin-Embedder-Policy "require-corp" always;
			add_header Cross-Origin-Opener-Policy "same-origin" always;
			add_header Cross-Origin-Resource-Policy "same-origin" always;
			add_header Cache-Control "no-cache, no-store, must-revalidate" always;
		}

		add_header Cross-Origin-Embedder-Policy "require-corp" always;
		add_header Cross-Origin-Opener-Policy "same-origin" always;
		add_header Cross-Origin-Resource-Policy "same-origin" always;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# WebSocket to the web proxy, which relays to the Luanti server
	location = /proxy {
		proxy_pass http://127.0.0.1:@PROXY_PORT@;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}
}
