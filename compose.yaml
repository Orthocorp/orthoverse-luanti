# The Orthoverse on Docker Compose. Settings: copy .env.example to .env.
#
#   docker compose up -d --build              start, or update after a git pull
#   docker compose run --rm --build map       redraw the web map
#   docker compose run --rm --build client    build and install the browser game
#
# See docker/README.md.

name: orthoverse

services:
  # The game server. It publishes no port: the only way in is the web proxy,
  # over the private "game" network.
  luanti:
    build:
      context: .
      dockerfile: docker/luanti/Dockerfile
      args:
        # The look of the world: a texture pack from texturepacks/, or none
        OV_TEXTURES: ${OV_TEXTURES:-soothing32}
    image: orthoverse/luanti
    # No privilege gained after start, and no kernel capabilities but those named
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    user: "${OV_UID:?set OV_UID in .env}:${OV_GID:?set OV_GID in .env}"
    volumes:
      - ${OV_WORLD:?set OV_WORLD in .env}:/world
      - ./docker/luanti/orthoverse.conf:/etc/orthoverse/orthoverse.conf:ro
      # Player names and land owners, written by the auth service
      - ${OV_DATA:?set OV_DATA in .env}/auth:/world/orthoverse_auth:ro
      # New lands, placed by the chain service
      - ${OV_DATA}/chain:/world/orthoverse_chain:ro
    environment:
      OV_NUMA_NODE: ${OV_NUMA_NODE:-}
      OV_ADMIN: ${OV_ADMIN:-}
    # numactl's memory binding needs this under Docker's default seccomp profile
    cap_add: [SYS_NICE]
    networks: [game]
    restart: unless-stopped
    # Time to save the world on shutdown
    stop_grace_period: 60s

  # Browser players' WebSocket to the game server's UDP
  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    image: orthoverse/proxy
    # No privilege gained after start, and no kernel capabilities but those named
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      OV_PROXY_HOST: 0.0.0.0
      OV_PROXY_PORT: "8737"
      OV_TARGET_HOST: luanti
      OV_TARGET_PORT: "30000"
      OV_VIRTUAL_IP: 10.58.0.1
      OV_MAX_SOCKETS: ${OV_MAX_SOCKETS:-100}
      OV_MAX_PER_IP: ${OV_MAX_PER_IP:-6}
    volumes:
      # Addresses kept out (./characters.sh ban), read again when changed
      - ${OV_DATA}/proxy:/blocked:ro
    networks: [game, web]
    read_only: true
    restart: unless-stopped
    depends_on: [luanti]

  # Wallet sign-in, player names, and land owners from the Ethereum contract.
  # With chain, the only services that reach the internet (an Ethereum RPC endpoint).
  auth:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    image: orthoverse/auth
    # No privilege gained after start, and no kernel capabilities but those named
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    user: "${OV_UID}:${OV_GID}"
    environment:
      OV_AUTH_SECRET: ${OV_AUTH_SECRET:?set OV_AUTH_SECRET in .env (openssl rand -hex 32)}
      OV_ETH_RPC: ${OV_ETH_RPC:-https://ethereum-rpc.publicnode.com}
      OV_CONTRACT: ${OV_CONTRACT:-0x118aeD2606D02C2545C6D7D2d1021e567cc08922}
      OV_CHAIN_TOKENS: /chain/tokens.json
      OV_PUBLIC_URL: ${OV_PUBLIC_URL:-https://orthoverse.land}
      # The admin may visit any spot from the map, as may holders of a level 7
      # land; nobody else may take the admin's name (OV_ADMIN_OPEN=1 in .env lets
      # the admin make it on the website, the first time; then remove it)
      OV_ADMIN: ${OV_ADMIN:-}
      OV_ADMIN_OPEN: ${OV_ADMIN_OPEN:-}
      # Cloudflare Turnstile on the registration form for password characters
      # (both empty: no check)
      OV_TURNSTILE_SITEKEY: ${OV_TURNSTILE_SITEKEY:-}
      OV_TURNSTILE_SECRET: ${OV_TURNSTILE_SECRET:-}
      # New characters an hour from everywhere together, and chain lookups a
      # minute that visitors can cause (docker/README.md)
      OV_NEW_PER_HOUR: ${OV_NEW_PER_HOUR:-60}
      OV_PUBLIC_RPC_PER_MIN: ${OV_PUBLIC_RPC_PER_MIN:-60}
      # OpenSea: refresh the metadata of lands that changed, every 20 minutes
      # (empty: OpenSea is not asked anything)
      OV_OPENSEA_KEY: ${OV_OPENSEA_KEY:-}
      OV_OPENSEA_EVERY_MIN: ${OV_OPENSEA_EVERY_MIN:-20}
    volumes:
      - ${OV_DATA}/auth:/data
      - ${OV_WORLD}:/world:ro
      # Who holds every token, from the chain service
      - ${OV_DATA}/chain:/chain:ro
      # The token pictures the map service draws (cards/index.json)
      - ${OV_DATA}/map:/map:ro
    networks: [web]
    read_only: true
    restart: unless-stopped

  # Every Orthoverse token, its holder, castle level and realm, read from the
  # contract's events once a day into OV_DATA/chain (orthoverse-chain.sqlite,
  # tokens.json, token-data.json). Index now: docker compose restart chain
  chain:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    image: orthoverse/auth
    # No privilege gained after start, and no kernel capabilities but those named
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: ["node", "chain.js"]
    user: "${OV_UID}:${OV_GID}"
    environment:
      OV_ETH_RPC: ${OV_ETH_RPC:-https://ethereum-rpc.publicnode.com}
      OV_CONTRACT: ${OV_CONTRACT:-0x118aeD2606D02C2545C6D7D2d1021e567cc08922}
      OV_CHAIN_EVERY_HOURS: ${OV_CHAIN_EVERY_HOURS:-1}
    volumes:
      - ${OV_DATA}/chain:/chain
      # The auth service asks for an index now (index-now) after a reveal
      - ${OV_DATA}/auth:/requests:ro
    networks: [outside]
    read_only: true
    restart: unless-stopped

  # orthoverse.land: the host's Cloudflare tunnel points at this port
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: orthoverse/web
    # No privilege gained after start, and no kernel capabilities but those named
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # nginx starts as root to bind port 80 and open its logs, then drops to its user
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    ports:
      - "127.0.0.1:${OV_WEB_PORT:-8485}:80"
    volumes:
      - ${OV_DATA:?set OV_DATA in .env}/map:/srv/map:ro
      - ${OV_DATA}/play:/srv/play:ro
    networks: [web]
    restart: unless-stopped
    depends_on: [proxy, auth]

  # Run on demand: docker compose run --rm --build map
  map:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/map/Dockerfile
    image: orthoverse/map
    # No privilege gained after start, and no kernel capabilities but those named
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    user: "${OV_UID}:${OV_GID}"
    volumes:
      - ${OV_WORLD}:/world:ro
      - ${OV_DATA}/map:/out
      - ${OV_DATA}/chain:/chain:ro
    network_mode: none

  # Every 5 minutes, draws again the map tiles, land pictures and token cards
  # of the lands that have changed
  mapwatch:
    build:
      context: .
      dockerfile: docker/map/Dockerfile
    image: orthoverse/map
    # No privilege gained after start, and no kernel capabilities but those named
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: ["watch"]
    user: "${OV_UID}:${OV_GID}"
    volumes:
      - ${OV_WORLD}:/world:ro
      - ${OV_DATA}/map:/out
      - ${OV_DATA}/chain:/chain:ro
    network_mode: none
    restart: unless-stopped

  # Every night at OV_BACKUP_AT (UTC), a copy of the world, the sign-ins and
  # the chain index on the backup drive (docker/backup/backup.js).
  #   docker compose run --rm backup node backup.js now    back up now
  #   docker compose run --rm backup node backup.js list   the backups there are
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: orthoverse/backup
    # No privilege gained after start, and no kernel capabilities but those named
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    user: "${OV_UID}:${OV_GID}"
    environment:
      OV_BACKUP_AT: ${OV_BACKUP_AT:-01:30}
      OV_BACKUP_DAYS: ${OV_BACKUP_DAYS:-14}
      OV_BACKUP_WEEKS: ${OV_BACKUP_WEEKS:-8}
      OV_BACKUP_MONTHS: ${OV_BACKUP_MONTHS:-12}
    volumes:
      - ${OV_WORLD}:/world:ro
      - ${OV_DATA}/auth:/data/auth:ro
      - ${OV_DATA}/chain:/data/chain:ro
      - ${OV_BACKUP:?set OV_BACKUP in .env}:/backup
    network_mode: none
    read_only: true
    restart: unless-stopped

  # Putting a backup back, with the game stopped (see docker/README.md):
  #   docker compose stop luanti auth chain backup
  #   docker compose run --rm restore <backup name>
  #   docker compose up -d
  # What was there before is moved to .before-restore-<time> folders, not deleted.
  restore:
    profiles: [tools]
    image: orthoverse/backup
    # No privilege gained after start, and no kernel capabilities but those named
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    entrypoint: ["node", "/app/backup.js", "restore"]
    user: "${OV_UID}:${OV_GID}"
    volumes:
      - ${OV_WORLD}:/world
      - ${OV_DATA}/auth:/data/auth
      - ${OV_DATA}/chain:/data/chain
      - ${OV_BACKUP}:/backup:ro
    network_mode: none

  # Run on demand: docker compose run --rm --build client
  client:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    image: orthoverse/client
    # No privilege gained after start, and no kernel capabilities but those named
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    user: "${OV_UID}:${OV_GID}"
    volumes:
      - ${OV_DATA}/play:/out
    network_mode: none

networks:
  # internal: no way out to the internet, and none in
  game:
    internal: true
  web: {}
  # The chain indexer's way to the RPC endpoint; nothing else is on it
  outside: {}
