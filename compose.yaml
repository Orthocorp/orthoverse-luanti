# The Orthoverse on Docker Compose. Settings: copy .env.example to .env.
#
#   docker compose up -d --build              start, or update after a git pull
#   docker compose run --rm --build map       redraw the web map
#   docker compose run --rm --build client    build and install the browser game
#
# See docker/README.md.

name: orthoverse

services:
  # The game server. It publishes no port: the only way in is the web proxy,
  # over the private "game" network.
  luanti:
    build:
      context: .
      dockerfile: docker/luanti/Dockerfile
    image: orthoverse/luanti
    user: "${OV_UID:?set OV_UID in .env}:${OV_GID:?set OV_GID in .env}"
    volumes:
      - ${OV_WORLD:?set OV_WORLD in .env}:/world
      - ./docker/luanti/orthoverse.conf:/etc/orthoverse/orthoverse.conf:ro
      # Player names and land owners, written by the auth service
      - ${OV_DATA:?set OV_DATA in .env}/auth:/world/orthoverse_auth:ro
      # New lands, placed by the chain service
      - ${OV_DATA}/chain:/world/orthoverse_chain:ro
    environment:
      OV_NUMA_NODE: ${OV_NUMA_NODE:-}
      OV_ADMIN: ${OV_ADMIN:-}
    # numactl's memory binding needs this under Docker's default seccomp profile
    cap_add: [SYS_NICE]
    networks: [game]
    restart: unless-stopped
    # Time to save the world on shutdown
    stop_grace_period: 60s

  # Browser players' WebSocket to the game server's UDP
  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    image: orthoverse/proxy
    environment:
      OV_PROXY_HOST: 0.0.0.0
      OV_PROXY_PORT: "8737"
      OV_TARGET_HOST: luanti
      OV_TARGET_PORT: "30000"
      OV_VIRTUAL_IP: 10.58.0.1
      OV_MAX_SOCKETS: ${OV_MAX_SOCKETS:-100}
      OV_MAX_PER_IP: ${OV_MAX_PER_IP:-6}
    networks: [game, web]
    read_only: true
    restart: unless-stopped
    depends_on: [luanti]

  # Wallet sign-in, player names, and land owners from the Ethereum contract.
  # With chain, the only services that reach the internet (an Ethereum RPC endpoint).
  auth:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    image: orthoverse/auth
    user: "${OV_UID}:${OV_GID}"
    environment:
      OV_AUTH_SECRET: ${OV_AUTH_SECRET:?set OV_AUTH_SECRET in .env (openssl rand -hex 32)}
      OV_ETH_RPC: ${OV_ETH_RPC:-https://ethereum-rpc.publicnode.com}
      OV_CONTRACT: ${OV_CONTRACT:-0x118aeD2606D02C2545C6D7D2d1021e567cc08922}
      OV_CHAIN_TOKENS: /chain/tokens.json
      OV_PUBLIC_URL: ${OV_PUBLIC_URL:-https://orthoverse.land}
    volumes:
      - ${OV_DATA}/auth:/data
      - ${OV_WORLD}:/world:ro
      # Who holds every token, from the chain service
      - ${OV_DATA}/chain:/chain:ro
      # The token pictures the map service draws (cards/index.json)
      - ${OV_DATA}/map:/map:ro
    networks: [web]
    read_only: true
    restart: unless-stopped

  # Every Orthoverse token, its holder, castle level and realm, read from the
  # contract's events once a day into OV_DATA/chain (orthoverse-chain.sqlite,
  # tokens.json, token-data.json). Index now: docker compose restart chain
  chain:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    image: orthoverse/auth
    command: ["node", "chain.js"]
    user: "${OV_UID}:${OV_GID}"
    environment:
      OV_ETH_RPC: ${OV_ETH_RPC:-https://ethereum-rpc.publicnode.com}
      OV_CONTRACT: ${OV_CONTRACT:-0x118aeD2606D02C2545C6D7D2d1021e567cc08922}
      OV_CHAIN_EVERY_HOURS: ${OV_CHAIN_EVERY_HOURS:-24}
    volumes:
      - ${OV_DATA}/chain:/chain
    networks: [outside]
    read_only: true
    restart: unless-stopped

  # orthoverse.land: the host's Cloudflare tunnel points at this port
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: orthoverse/web
    ports:
      - "127.0.0.1:${OV_WEB_PORT:-8485}:80"
    volumes:
      - ${OV_DATA:?set OV_DATA in .env}/map:/srv/map:ro
      - ${OV_DATA}/play:/srv/play:ro
    networks: [web]
    restart: unless-stopped
    depends_on: [proxy, auth]

  # Run on demand: docker compose run --rm --build map
  map:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/map/Dockerfile
    image: orthoverse/map
    user: "${OV_UID}:${OV_GID}"
    volumes:
      - ${OV_WORLD}:/world:ro
      - ${OV_DATA}/map:/out
      - ${OV_DATA}/chain:/chain:ro
    network_mode: none

  # Redraws the web map and the token pictures when the game has made the
  # terrain of new lands, and every night
  mapwatch:
    build:
      context: .
      dockerfile: docker/map/Dockerfile
    image: orthoverse/map
    command: ["watch"]
    environment:
      OV_MAP_HOUR: ${OV_MAP_HOUR:-3}
    user: "${OV_UID}:${OV_GID}"
    volumes:
      - ${OV_WORLD}:/world:ro
      - ${OV_DATA}/map:/out
      - ${OV_DATA}/chain:/chain:ro
    network_mode: none
    restart: unless-stopped

  # Run on demand: docker compose run --rm --build client
  client:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/client/Dockerfile
    image: orthoverse/client
    user: "${OV_UID}:${OV_GID}"
    volumes:
      - ${OV_DATA}/play:/out
    network_mode: none

networks:
  # internal: no way out to the internet, and none in
  game:
    internal: true
  web: {}
  # The chain indexer's way to the RPC endpoint; nothing else is on it
  outside: {}
