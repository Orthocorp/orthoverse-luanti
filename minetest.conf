# Game defaults for the Orthoverse. Map settings take effect when a world is created.

# One Orthoverse land is 96 x 96 nodes = 6 x 6 mapblocks, so one mapchunk is one land.
chunksize = 6

# Flat base terrain; the Orthoverse mapgen shapes the surface from each land's token ID.
# The engine still supplies caves, caverns, dungeons and ores.
mg_name = flat
mg_flags = caves, dungeons, light, nodecorations, biomes, ores
mgflat_spflags = nolakes, nohills, caverns
mgflat_ground_level = 8
water_level = 1

# Lands -58..58 (walls at 58), each 96 nodes, centred on the origin: |x|,|z| <= 58*96 + 48
mapgen_limit = 5664

static_spawnpoint = 0, 10, -8

# 3D Armor (mods/armor): the materials the Orthoverse has (wood, steel, bronze,
# gold, diamond); these would need mods the game does not have
armor_material_cactus = false
armor_material_mithril = false
armor_material_crystal = false
armor_material_nether = false
